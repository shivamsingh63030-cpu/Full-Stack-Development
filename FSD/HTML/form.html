<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1> Registration form</h1>
    <form>
        <lable>Name:</lable>
        <input type="text">
        <br><br>
        <lable>Age:</lable>
        <input type="number">
        <br><br>
        <lable>Password:</lable>
        <input type="password">
<br><br>
        <lable for="male">Male</lable>
        <input type="radio" name="gender" id="male" value="male">

        <lable for="female">Female</lable>
        <input type="radio" name="gender" id="female" value="female">

        <lable for="other">Other</lable>
        <input type="radio" name="gender" id="other" value="other">
        <input type="submit">


        <br><br>
        <lable for="c++">C++</lable>
        <input type="checkbox" name="languages" id="c++" value="c++">

        <lable for="java">Java</lable>
        <input type="checkbox" name="languages" id="java" value="java">

        <lable for="python">Python</lable>
        <input type="checkbox" name="languages" id="python" value="python">

        <lable for="javascript">JavaScript</lable>
        <input type="checkbox" name="languages" id="javascript" value="javascript"> 

       

    </form>
